services:
  reverse-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: timeweb-reverse-proxy:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PREFLIGHT: "0"
      KEEPALIVE_PING_ENABLED: "False"
      LOG_JSONL_PATH: /app/logs/requests.jsonl
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../clients.json:/app/clients.json:ro
      - reverse_proxy_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  reverse_proxy_logs:
